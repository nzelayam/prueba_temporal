                    onShowToast("Plan copiado exitosamente");
                });
            };

            const toggleDiaPatron = (diaIdx) => {
                if (patronDias.includes(diaIdx)) setPatronDias(patronDias.filter(d => d !== diaIdx));
                else setPatronDias([...patronDias, diaIdx]);
            };

            const guardarEdicionManual = (fecha, cat, valor) => {
                const nuevoPlanMes = { ...(planMensual[planMesSeleccionado] || {}) };
                if (!nuevoPlanMes[fecha]) nuevoPlanMes[fecha] = {};
                if (valor === '' || parseFloat(valor) === 0) delete nuevoPlanMes[fecha][cat];
                else nuevoPlanMes[fecha][cat] = parseFloat(valor);
                setPlanMensual({ ...planMensual, [planMesSeleccionado]: nuevoPlanMes });
            };

            return (
                <div className="pb-24 space-y-6">
                    <div className="flex items-center justify-between sticky top-0 bg-slate-50 py-2 z-10">
                        <h2 className="text-2xl font-bold text-slate-800">Plan Mensual</h2>
                        <div className="flex gap-2">
                            <button onClick={limpiarMes} className="p-2 text-rose-500 bg-rose-50 rounded-lg hover:bg-rose-100" title="Borrar todo"><Eraser size={20}/></button>
                            <button onClick={copiarMesAnterior} className="p-2 text-blue-500 bg-blue-50 rounded-lg hover:bg-blue-100" title="Copiar anterior"><Copy size={20}/></button>
                            <input type="month" value={planMesSeleccionado} onChange={(e) => setPlanMesSeleccionado(e.target.value)} className="bg-white border border-slate-300 text-sm rounded-lg p-2 outline-none shadow-sm" />
                        </div>
                    </div>

                    <Card>
                        <div className="flex items-center justify-between mb-4">
                            <h3 className="font-bold text-slate-700 flex items-center gap-2"><Edit3 size={18} /> Planificar Gasto</h3>
                            <div className="flex bg-slate-100 p-0.5 rounded-lg">
                                <button onClick={() => setTipoPlanificacion('patron')} className={`px-3 py-1 rounded-md text-xs font-bold transition-all ${tipoPlanificacion === 'patron' ? 'bg-white shadow text-slate-800' : 'text-slate-400'}`}>Repetir</button>
                                <button onClick={() => setTipoPlanificacion('unico')} className={`px-3 py-1 rounded-md text-xs font-bold transition-all ${tipoPlanificacion === 'unico' ? 'bg-white shadow text-slate-800' : 'text-slate-400'}`}>Único</button>
                            </div>
                        </div>
                        <div className="space-y-4">
                            <div className="flex gap-4">
                                <div className="flex-1">
                                    <label className="text-xs font-semibold text-slate-500 uppercase">Categoría</label>
                                    <select value={patronCat} onChange={(e) => setPatronCat(e.target.value)} className="w-full mt-1 p-2 bg-slate-50 rounded-lg border border-slate-200 outline-none text-sm">
                                        {categoriasGastos.map(c => <option key={c} value={c}>{c}</option>)}
                                    </select>
                                </div>
                                <div className="w-1/3">
                                    <label className="text-xs font-semibold text-slate-500 uppercase">Monto</label>
                                    <input type="number" value={patronMonto} onChange={(e) => setPatronMonto(e.target.value)} className="w-full mt-1 p-2 bg-slate-50 rounded-lg border border-slate-200 outline-none font-bold text-sm" placeholder="0" />
                                </div>
                            </div>
                            <div>
                                {tipoPlanificacion === 'patron' ? (
                                    <>
                                        <label className="text-xs font-semibold text-slate-500 uppercase mb-2 block">Días a aplicar</label>
                                        <div className="flex justify-between gap-1 mb-2">
                                            {DIAS_SEMANA.map((d, idx) => (
                                                <button key={d} onClick={() => toggleDiaPatron(idx)} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${patronDias.includes(idx) ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-400'}`}>{d[0]}</button>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => setPatronDias([1,2,3,4,5])} className="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded">Lun-Vie</button>
                                            <button onClick={() => setPatronDias([0,6])} className="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded">Fines</button>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <label className="text-xs font-semibold text-slate-500 uppercase mb-2 block">Fecha</label>
                                        <input type="date" value={fechaUnica} onChange={(e) => setFechaUnica(e.target.value)} className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium outline-none" />
                                    </>
                                )}
                            </div>
                            <button onClick={aplicarPlan} className="w-full bg-slate-800 text-white py-3 rounded-lg font-bold text-sm flex items-center justify-center gap-2">
                                {tipoPlanificacion === 'patron' ? <Repeat size={16} /> : <CalendarDays size={16} />} {tipoPlanificacion === 'patron' ? 'Aplicar Patrón' : 'Añadir Gasto'}
                            </button>
                        </div>
                    </Card>

                    <div className="space-y-2">
                        <h3 className="font-bold text-slate-700 ml-1">Calendario</h3>
                        {obtenerDiasDelMes(parseInt(planMesSeleccionado.split('-')[0]), parseInt(planMesSeleccionado.split('-')[1])-1).map(date => {
                            const dateStr = date.toISOString().split('T')[0];
                            const planDia = planMensual[planMesSeleccionado]?.[dateStr] || {};
                            const totalDia = Object.values(planDia).reduce((a, b) => a + b, 0);
                            const categoriasDia = Object.keys(planDia);
                            const esFeriadoDia = esFeriado(date, pais);
                            const esFinde = date.getDay() === 0 || date.getDay() === 6;
                            
                            let bgClass = "bg-white";
                            let borderClass = "border-slate-100";
                            if (esFeriadoDia) { bgClass = "bg-rose-50"; borderClass = "border-rose-100"; }
                            else if (esFinde) { bgClass = "bg-blue-50"; borderClass = "border-blue-100"; }

                            return (
                                <div key={dateStr} onClick={() => setDiaEditando(dateStr)} className={`${bgClass} p-3 rounded-lg border ${borderClass} flex justify-between items-center text-sm active:bg-slate-100 cursor-pointer transition-colors`}>
                                    <div className="flex items-center gap-3 overflow-hidden">
                                        <div className={`flex flex-col items-center justify-center rounded p-1 w-12 text-center ${esFeriadoDia ? 'bg-rose-100 text-rose-600' : esFinde ? 'bg-blue-100 text-blue-600' : 'bg-slate-100 text-slate-500'}`}>
                                            <span className="text-[10px] uppercase font-bold">{date.toLocaleDateString('es-PE', {weekday: 'short'})}</span>
                                            <span className="text-lg font-bold leading-none">{date.getDate()}</span>
                                        </div>
                                        <div className="flex flex-col min-w-0">
                                            {esFeriadoDia && <span className="text-[10px] text-rose-500 font-bold uppercase mb-0.5">Feriado</span>}
                                            <span className="text-xs text-slate-500 truncate">{categoriasDia.length > 0 ? categoriasDia.join(', ') : 'Sin planificar'}</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className={`font-bold ${totalDia > 0 ? 'text-slate-700' : 'text-slate-300'}`}>{formatearDinero(totalDia, monedaCfg)}</span>
                                        <ChevronRight size={16} className="text-slate-300" />
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {diaEditando && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-white w-full max-w-md h-[80vh] sm:h-auto sm:rounded-2xl rounded-t-2xl flex flex-col shadow-2xl">
                                <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                                    <div><h3 className="font-bold text-lg">Editar Plan</h3><p className="text-xs text-slate-500">{diaEditando}</p></div>
                                    <button onClick={() => setDiaEditando(null)} className="p-2 bg-slate-200 rounded-full"><X size={20}/></button>
                                </div>
                                <div className="overflow-y-auto p-4 space-y-3 flex-1">
                                    {categoriasGastos.map(cat => (
                                        <div key={cat} className="flex items-center justify-between p-2 border border-slate-100 rounded-lg hover:bg-slate-50">
                                            <label className="text-sm font-medium text-slate-700 flex-1">{cat}</label>
                                            <div className="relative w-32">
                                                <span className="absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-xs">{monedaCfg.simbolo}</span>
                                                <input type="number" placeholder="0" value={planMensual[planMesSeleccionado]?.[diaEditando]?.[cat] || ''} onChange={(e) => guardarEdicionManual(diaEditando, cat, e.target.value)} className="w-full pl-6 p-2 bg-white border border-slate-200 rounded text-right font-bold text-slate-800 focus:border-blue-500 outline-none"/>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-4 border-t border-slate-100"><button onClick={() => setDiaEditando(null)} className="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">Terminar Edición</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('resumen');
            const [modalConfig, setModalConfig] = useState({ show: false, message: '', onConfirm: null });
            const [promptConfig, setPromptConfig] = useState({ show: false, title: '', initialValue: '', onConfirm: null });
            const [infoModalConfig, setInfoModalConfig] = useState({ show: false, title: '', content: null });
            const [notification, setNotification] = useState({ show: false, message: '', type: 'success' });

            const [pais, setPais] = useState(() => localStorage.getItem('finanzas_pais') || 'PE');
            const [moneda, setMoneda] = useState(() => {
                const saved = localStorage.getItem('finanzas_moneda');
                return saved ? JSON.parse(saved) : { codigo: 'PEN', simbolo: 'S/' };
            });

            const [categoriasGastos, setCategoriasGastos] = useState(() => {
                const saved = localStorage.getItem('finanzas_cat_gastos');
                return saved ? JSON.parse(saved) : DEFAULT_CATEGORIAS_GASTOS;
            });
            const [categoriasIngresos, setCategoriasIngresos] = useState(() => {
                const saved = localStorage.getItem('finanzas_cat_ingresos');
                return saved ? JSON.parse(saved) : DEFAULT_CATEGORIAS_INGRESOS;
            });
            const [saldosIniciales, setSaldosIniciales] = useState(() => {
                const saved = localStorage.getItem('finanzas_saldos');
                const defaultSaldos = { normal: 1500, ahorro: 10000, fechaCorte: new Date().toISOString().split('T')[0] };
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Compatibilidad con datos antiguos sin fecha
                    if (!parsed.fechaCorte) parsed.fechaCorte = '2020-01-01';
                    return parsed;
                }
                return defaultSaldos;
            });
            const [transacciones, setTransacciones] = useState(() => {
                const saved = localStorage.getItem('finanzas_transacciones');
                return saved ? JSON.parse(saved) : [];
            });
            const [planMensual, setPlanMensual] = useState(() => {
                const saved = localStorage.getItem('finanzas_plan');
                return saved ? JSON.parse(saved) : {};
            });
            
            const [metaAhorro, setMetaAhorro] = useState(() => {
                const saved = localStorage.getItem('finanzas_meta');
                return saved ? JSON.parse(saved) : { nombre: '', monto: 0, fecha: '' };
            });

            const [nuevoMonto, setNuevoMonto] = useState('');
            const [nuevaDesc, setNuevaDesc] = useState('');
            const [nuevaCat, setNuevaCat] = useState(categoriasGastos[0]);
            const [nuevoTipo, setNuevoTipo] = useState('gasto');
            const [nuevaFecha, setNuevaFecha] = useState(new Date().toISOString().split('T')[0]);
            
            const [planMesSeleccionado, setPlanMesSeleccionado] = useState(new Date().toISOString().slice(0, 7));

            const historialSugerencias = useMemo(() => {
                const mapa = {};
                // Recorremos de más antiguo a más reciente para que la última categoría usada sea la que quede
                [...transacciones].reverse().forEach(t => {
                    if (t.descripcion && t.categoria) {
                        mapa[t.descripcion] = { categoria: t.categoria, tipo: t.tipo };
                    }
                });
                return mapa;
            }, [transacciones]);

            useEffect(() => localStorage.setItem('finanzas_transacciones', JSON.stringify(transacciones)), [transacciones]);
            useEffect(() => localStorage.setItem('finanzas_plan', JSON.stringify(planMensual)), [planMensual]);
            useEffect(() => localStorage.setItem('finanzas_saldos', JSON.stringify(saldosIniciales)), [saldosIniciales]);
            useEffect(() => localStorage.setItem('finanzas_cat_gastos', JSON.stringify(categoriasGastos)), [categoriasGastos]);
            useEffect(() => localStorage.setItem('finanzas_cat_ingresos', JSON.stringify(categoriasIngresos)), [categoriasIngresos]);
            useEffect(() => localStorage.setItem('finanzas_pais', pais), [pais]);
            useEffect(() => localStorage.setItem('finanzas_moneda', JSON.stringify(moneda)), [moneda]);
            useEffect(() => localStorage.setItem('finanzas_meta', JSON.stringify(metaAhorro)), [metaAhorro]);

            useEffect(() => {
                if (nuevoTipo === 'gasto' && !categoriasGastos.includes(nuevaCat)) setNuevaCat(categoriasGastos[0]);
                if (nuevoTipo === 'ingreso' && !categoriasIngresos.includes(nuevaCat)) setNuevaCat(categoriasIngresos[0]);
            }, [nuevoTipo, categoriasGastos, categoriasIngresos]);

            const showNotification = (msg, type='success') => { setNotification({ show: true, message: msg, type }); setTimeout(() => setNotification(prev => ({ ...prev, show: false })), 3000); };
            const requestConfirmation = (message, action) => { setModalConfig({ show: true, message, onConfirm: action }); };
            const requestRename = (title, initialValue, action, oldName, type) => {
                const wrappedAction = (newName) => {
                    action(newName);
                    setTransacciones(prev => prev.map(t => { if (t.categoria === oldName && ((type === 'gasto' && t.tipo === 'gasto') || (type === 'ingreso' && t.tipo === 'ingreso'))) { return { ...t, categoria: newName }; } return t; }));
                    setPlanMensual(prevPlan => {
                        const newPlan = { ...prevPlan };
                        Object.keys(newPlan).forEach(monthKey => {
                            const monthData = { ...newPlan[monthKey] };
                            let monthChanged = false;
                            Object.keys(monthData).forEach(dayKey => {
                                const dayData = { ...monthData[dayKey] };
                                if (dayData[oldName] !== undefined) { dayData[newName] = dayData[oldName]; delete dayData[oldName]; monthData[dayKey] = dayData; monthChanged = true; }
                            });
                            if (monthChanged) newPlan[monthKey] = monthData;
                        });
                        return newPlan;
                    });
                    setPromptConfig({ ...promptConfig, show: false });
                };
                setPromptConfig({ show: true, title, initialValue, onConfirm: wrappedAction });
            };
            const handleConfirmAction = () => { if (modalConfig.onConfirm) modalConfig.onConfirm(); setModalConfig({ show: false, message: '', onConfirm: null }); };
            
            const handleShowHelp = () => {
                const content = (
                    <div className="space-y-4 text-sm text-slate-600">
                        <div className="bg-blue-50 p-3 rounded-lg border border-blue-100">
                            <h4 className="font-bold text-blue-800 mb-2">🚀 Tutorial Rápido</h4>
                            <ul className="list-disc ml-4 space-y-1">
                                <li><strong>Inicio:</strong> Ve tu saldo actual, progreso de ahorro y análisis de gastos.</li>
                                <li><strong>Plan:</strong> Define cuánto puedes gastar. Usa "Repetir" para gastos diarios (ej. pasajes) y "Único" para eventos puntuales.</li>
                                <li><strong>Agregar (botón +):</strong> Registra tus gastos o ingresos al momento.</li>
                                <li><strong>Movim.:</strong> Revisa y elimina transacciones pasadas.</li>
                                <li><strong>Ajustes:</strong> Configura tus saldos iniciales, categorías y haz copias de seguridad.</li>
                            </ul>
                        </div>
                        <div className="bg-slate-50 p-3 rounded-lg border border-slate-200">
                            <h4 className="font-bold text-slate-800 mb-2">❓ Preguntas Frecuentes</h4>
                            <details className="mb-2">
                                <summary className="font-semibold cursor-pointer text-slate-700">¿Dónde se guardan mis datos?</summary>
                                <p className="mt-1 pl-4 text-xs">Se guardan en la memoria interna de tu navegador (localStorage). No se comparten con nadie.</p>
                            </details>
                            <details className="mb-2">
                                <summary className="font-semibold cursor-pointer text-slate-700">¿Si cambio de celular pierdo todo?</summary>
                                <p className="mt-1 pl-4 text-xs">Sí, a menos que uses la opción "Exportar Backup" en Ajustes y pases el archivo .finat a tu nuevo celular.</p>
                            </details>
                             <details>
                                <summary className="font-semibold cursor-pointer text-slate-700">¿Cómo funciona la Meta de Ahorro?</summary>
                                <p className="mt-1 pl-4 text-xs">Define un monto en Ajustes. La barra de progreso se llenará según el saldo de tu cuenta de ahorros.</p>
                            </details>
                        </div>
                    </div>
                );
                setInfoModalConfig({ show: true, title: "Centro de Ayuda", content });
            };

            const handleShowAbout = () => {
                 const content = (
                    <div className="text-center space-y-4">
                        <div className="flex justify-center mb-4">
                           <div className="p-4 bg-blue-100 rounded-full text-blue-600"><Atom size={48} /></div>
                        </div>
                        <div>
                            <h3 className="text-xl font-bold text-slate-800">Finanzas Atómicas</h3>
                            <span className="text-xs font-mono bg-slate-100 px-2 py-1 rounded text-slate-500">Versión 1.0.7</span>
                        </div>
                        <div className="text-sm text-slate-600 bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <p className="mb-2">Desarrollado con ❤️ para ayudarte a construir hábitos financieros sólidos.</p>
                            <div className="border-t border-slate-200 my-3"></div>
                            <p className="font-bold text-slate-800">Autor:</p>
                            <p>Noe Zelaya</p>
                            <p className="text-xs text-slate-400">Lima, Perú</p>
                            <p className="mt-2 font-bold text-slate-800">Contacto:</p>
                            <a href="mailto:nzelayam@uni.pe" className="text-blue-600 hover:underline">nzelayam@uni.pe</a>
                            <p className="mt-4 text-xs text-slate-400">Última actualización: 04 de febrero del 2026</p>
                        </div>
                    </div>
                );
                setInfoModalConfig({ show: true, title: "Acerca de", content });
            };

            const handleExport = () => {
                const data = {
                    transacciones,
                    planMensual,
                    saldosIniciales,
                    categoriasGastos,
                    categoriasIngresos,
                    pais,
                    moneda,
                    metaAhorro
                };
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `backup_finanzas_${new Date().toISOString().split('T')[0]}.finat`;
                a.click();
                URL.revokeObjectURL(url);
                showNotification("Backup exportado correctamente");
            };

            const handleImport = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if(confirm("Esto reemplazará todos tus datos actuales. ¿Estás seguro?")) {
                            if(data.transacciones) setTransacciones(data.transacciones);
                            if(data.planMensual) setPlanMensual(data.planMensual);
                            if(data.saldosIniciales) setSaldosIniciales(data.saldosIniciales);
                            if(data.categoriasGastos) setCategoriasGastos(data.categoriasGastos);
                            if(data.categoriasIngresos) setCategoriasIngresos(data.categoriasIngresos);
                            if(data.pais) setPais(data.pais);
                            if(data.moneda) setMoneda(data.moneda);
                            if(data.metaAhorro) setMetaAhorro(data.metaAhorro);
                            showNotification("Datos restaurados correctamente");
                        }
                    } catch (err) {
                        showNotification("Error al importar el archivo", "error");
                    }
                };
                reader.readAsText(file);
            };

            const resumen = useMemo(() => {
                const currentMonth = new Date().toISOString().slice(0, 7);
                const fechaCorte = saldosIniciales.fechaCorte || '2020-01-01';
                let saldoNormal = saldosIniciales.normal;
                let saldoAhorro = saldosIniciales.ahorro;
                let ingresosMes = 0;
                let gastosMes = 0;
                let ahorroMes = 0;

                // Solo considerar transacciones desde la fecha de corte
                transacciones.filter(t => t.fecha >= fechaCorte).forEach(t => {
                    const monto = parseFloat(t.monto);
                    if (t.tipo === 'ingreso') { saldoNormal += monto; if (t.fecha.startsWith(currentMonth)) ingresosMes += monto; }
                    else if (t.tipo === 'gasto') { saldoNormal -= monto; if (t.fecha.startsWith(currentMonth)) gastosMes += monto; }
                    else if (t.tipo === 'transferencia_ahorro') { saldoNormal -= monto; saldoAhorro += monto; if (t.fecha.startsWith(currentMonth)) ahorroMes += monto; }
                });
                return { saldoNormal, saldoAhorro, ingresosMes, gastosMes, ahorroMes };
            }, [transacciones, saldosIniciales]);

            const datosCurvas = useMemo(() => {
                const [year, month] = planMesSeleccionado.split('-').map(Number);
                const diasDelMes = obtenerDiasDelMes(year, month - 1);
                const planDelMes = planMensual[planMesSeleccionado] || {};
                let acumuladoPlan = 0;
                let acumuladoReal = 0;
                const seriePlan = [];
                const serieReal = [];
                const hoy = new Date();
                const esMesActual = hoy.getFullYear() === year && hoy.getMonth() === month - 1;
                const diaActual = hoy.getDate();

                diasDelMes.forEach(date => {
                    const dateStr = date.toISOString().split('T')[0];
                    const diaNum = date.getDate();
                    const planDia = planDelMes[dateStr];
                    if (planDia) Object.values(planDia).forEach(val => acumuladoPlan += (val || 0));
                    seriePlan.push(acumuladoPlan);
                    if (!esMesActual || diaNum <= diaActual) {
                        transacciones.filter(t => t.fecha === dateStr && t.tipo === 'gasto').forEach(t => acumuladoReal += parseFloat(t.monto));
                        serieReal.push(acumuladoReal);
                    }
                });
                return { seriePlan, serieReal, dias: diasDelMes.length };
            }, [planMensual, transacciones, planMesSeleccionado]);

            const handleGuardarTransaccion = (e) => {
                e.preventDefault();
                if (!nuevoMonto || !nuevaDesc) return;
                const nueva = { id: Date.now(), fecha: nuevaFecha, descripcion: nuevaDesc, monto: parseFloat(nuevoMonto), categoria: nuevaCat, tipo: nuevoTipo };
                setTransacciones([nueva, ...transacciones]);
                setNuevoMonto(''); setNuevaDesc(''); setNuevaFecha(new Date().toISOString().split('T')[0]);
                showNotification("Guardado");
            };

            const handleBorrarTransaccion = (id) => { requestConfirmation("¿Borrar movimiento?", () => { setTransacciones(transacciones.filter(t => t.id !== id)); showNotification("Eliminado"); }); };

            const handleEditarTransaccion = (id, datosActualizados) => {
                setTransacciones(transacciones.map(t => t.id === id ? { ...t, ...datosActualizados } : t));
                showNotification("Movimiento actualizado");
            };

            return (
                <div className="flex flex-col h-full bg-slate-50 font-sans text-slate-900 select-none">
                    <Toast message={notification.message} show={notification.show} type={notification.type} />
                    <ConfirmModal show={modalConfig.show} message={modalConfig.message} onConfirm={handleConfirmAction} onCancel={() => setModalConfig({ ...modalConfig, show: false })} />
                    <PromptModal show={promptConfig.show} title={promptConfig.title} initialValue={promptConfig.initialValue} onConfirm={promptConfig.onConfirm} onCancel={() => setPromptConfig({ ...promptConfig, show: false })} />
                    <InfoModal show={infoModalConfig.show} title={infoModalConfig.title} content={infoModalConfig.content} onClose={() => setInfoModalConfig({...infoModalConfig, show: false})} />

                    <div className="flex-none bg-white px-4 py-3 shadow-sm flex justify-between items-center border-b border-gray-100 z-10">
                        <h1 className="font-bold text-lg text-blue-800 tracking-tight flex items-center gap-2"><Atom size={20}/> Finanzas Atómicas</h1>
                        <div className="text-xs font-medium bg-slate-100 px-2 py-1 rounded text-slate-600">{new Date().toLocaleDateString('es-PE', { month: 'long' }).toUpperCase()}</div>
                    </div>

                    <main className="flex-1 overflow-y-auto max-w-md mx-auto w-full p-4 md:p-6 bg-slate-50 md:bg-white md:shadow-xl md:my-4 md:rounded-[40px] md:border-8 md:border-slate-800 hide-scrollbar overscroll-contain">
                        {activeTab === 'resumen' && <VistaResumen resumen={resumen} datosCurvas={datosCurvas} planMesSeleccionado={planMesSeleccionado} setPlanMesSeleccionado={setPlanMesSeleccionado} onIrAPlan={() => setActiveTab('plan')} planMensual={planMensual} transacciones={transacciones} monedaCfg={moneda} metaAhorro={metaAhorro} />}
                        {activeTab === 'plan' && <VistaPlanificacion planMesSeleccionado={planMesSeleccionado} setPlanMesSeleccionado={setPlanMesSeleccionado} planMensual={planMensual} setPlanMensual={setPlanMensual} categoriasGastos={categoriasGastos} onShowToast={showNotification} onRequestConfirm={requestConfirmation} pais={pais} monedaCfg={moneda} />}
                        {activeTab === 'agregar' && <VistaAgregar monto={nuevoMonto} setMonto={setNuevoMonto} desc={nuevaDesc} setDesc={setNuevaDesc} cat={nuevaCat} setCat={setNuevaCat} tipo={nuevoTipo} setTipo={setNuevoTipo} fecha={nuevaFecha} setFecha={setNuevaFecha} categoriasGastos={categoriasGastos} categoriasIngresos={categoriasIngresos} onGuardar={handleGuardarTransaccion} monedaCfg={moneda} historialSugerencias={historialSugerencias} />}
                        {activeTab === 'historial' && <VistaHistorial transacciones={transacciones} onBorrar={handleBorrarTransaccion} onEditar={handleEditarTransaccion} monedaCfg={moneda} categoriasGastos={categoriasGastos} categoriasIngresos={categoriasIngresos} />}
                        {activeTab === 'ajustes' && <VistaAjustes categoriasGastos={categoriasGastos} setCategoriasGastos={setCategoriasGastos} categoriasIngresos={categoriasIngresos} setCategoriasIngresos={setCategoriasIngresos} saldos={saldosIniciales} setSaldos={setSaldosIniciales} pais={pais} setPais={setPais} moneda={moneda} setMoneda={setMoneda} metaAhorro={metaAhorro} setMetaAhorro={setMetaAhorro} onRequestConfirm={requestConfirmation} onRequestRename={requestRename} onShowToast={showNotification} onImport={handleImport} onExport={handleExport} onShowHelp={handleShowHelp} onShowAbout={handleShowAbout} />}
                    </main>

                    <nav className="flex-none bg-white border-t border-gray-200 z-10 pb-safe md:rounded-b-[32px] md:max-w-md md:mx-auto md:w-full">
                        <div className="flex justify-around items-center h-16">
                            <button onClick={() => setActiveTab('resumen')} className={`nav-btn flex flex-col items-center justify-center w-full h-full ${activeTab === 'resumen' ? 'text-blue-600' : 'text-slate-400'}`}><Home size={22} strokeWidth={activeTab === 'resumen' ? 2.5 : 2} /><span className="text-[10px] mt-1 font-medium">Inicio</span></button>
                            <button onClick={() => setActiveTab('plan')} className={`nav-btn flex flex-col items-center justify-center w-full h-full ${activeTab === 'plan' ? 'text-blue-600' : 'text-slate-400'}`}><CalendarIcon size={22} strokeWidth={activeTab === 'plan' ? 2.5 : 2} /><span className="text-[10px] mt-1 font-medium">Plan</span></button>
                            <div className="relative -top-6"><button onClick={() => setActiveTab('agregar')} className="bg-blue-600 text-white p-4 rounded-full shadow-lg shadow-blue-600/30 transform transition-transform active:scale-95"><PlusCircle size={28} /></button></div>
                            <button onClick={() => setActiveTab('historial')} className={`nav-btn flex flex-col items-center justify-center w-full h-full ${activeTab === 'historial' ? 'text-blue-600' : 'text-slate-400'}`}><List size={22} strokeWidth={activeTab === 'historial' ? 2.5 : 2} /><span className="text-[10px] mt-1 font-medium">Movim.</span></button>
                            <button onClick={() => setActiveTab('ajustes')} className={`nav-btn flex flex-col items-center justify-center w-full h-full ${activeTab === 'ajustes' ? 'text-blue-600' : 'text-slate-400'}`}><Settings size={22} strokeWidth={activeTab === 'ajustes' ? 2.5 : 2} /><span className="text-[10px] mt-1 font-medium">Ajustes</span></button>
                        </div>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        window.addEventListener('load', () => {
            root.render(<App />);
        });
    </script>
</body>
</html>
